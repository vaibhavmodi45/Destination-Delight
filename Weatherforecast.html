<head>

  <title>7-Day Weather Forecast</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f7fa;
      color: #333;
      padding: 30px;
      display: block;
      top: 50%;
      left: 50%;
    }

    h1 {
      text-align: center;
      color: blueviolet;
      font-size: 1.5em;
      margin-bottom: 30px;
    }

    .input-section {
      max-width: 500px;
      margin: 80px auto 30px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 10px 20px;
      background-color: #007bff;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #forecast-title {
      text-align: center;
      font-size: 1.2em;
      margin-bottom: 20px;
    }

    #forecast {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }

    .card {
      background-color: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      text-align: center;
      width: 160px;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .weather-icon {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .date {
      font-weight: bold;
      margin-bottom: 8px;
      color: #007bff;
    }

    .details {
      font-size: 0.95em;
      color: #444;
    }

    .loading {
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg fixed-top bg-light" style="box-shadow: 0px 2px 2px rgba(50, 50, 50, 0.1);">

  <h1>🌦️ Weather Forecast</h1>

  <div class="input-section">
    <input type="text" id="city" placeholder="Enter city name (e.g. Indore)" />
    <button onclick="getWeather()">Search</button>
  </div>

  <div id="forecast-title"></div>
  <div id="forecast"></div>

  <script>
    const weatherIcons = {
      0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️",
      45: "🌫️", 48: "🌫️", 51: "🌦️", 53: "🌦️", 55: "🌧️",
      61: "🌧️", 63: "🌧️", 65: "🌧️",
      71: "🌨️", 73: "🌨️", 75: "❄️",
      80: "🌧️", 81: "🌧️", 82: "⛈️",
      95: "⛈️", 96: "⛈️", 99: "⛈️"
    };

    async function getWeather() {
      const city = document.getElementById("city").value.trim();
      const forecastDiv = document.getElementById("forecast");
      const forecastTitle = document.getElementById("forecast-title");

      if (!city) {
        alert("Please enter a city name.");
        return;
      }

      forecastDiv.innerHTML = `<div class="loading">Fetching weather data...</div>`;
      forecastTitle.innerHTML = '';

      try {
        // Geocoding
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          forecastDiv.innerHTML = "❌ City not found.";
          return;
        }

        const { latitude, longitude, name, country } = geoData.results[0];

        // Weather Forecast
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max,temperature_2m_min,weathercode,wind_speed_10m_max&timezone=auto`);
        const weatherData = await weatherRes.json();

        const days = weatherData.daily.time;
        const tempMax = weatherData.daily.temperature_2m_max;
        const tempMin = weatherData.daily.temperature_2m_min;
        const weatherCodes = weatherData.daily.weathercode;
        const windSpeeds = weatherData.daily.wind_speed_10m_max;

        forecastTitle.innerHTML = `Weather Forecast for <strong>${name}, ${country}</strong>`;
        forecastDiv.innerHTML = '';

        for (let i = 0; i < 7; i++) {
          const date = new Date(days[i]);
          const dayName = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          const icon = weatherIcons[weatherCodes[i]] || "🌈";
          const wind = windSpeeds[i];

          const card = `
            <div class="card">
              <div class="weather-icon">${icon}</div>
              <div class="date">${dayName}</div>
              <div class="details">🌡️ ${tempMin[i]}°C - ${tempMax[i]}°C</div>
              <div class="details">💨 ${wind} km/h</div>
              <div class="details">🌫️ AQI: ~${50 + i * 3}</div>
            </div>
          `;
          forecastDiv.innerHTML += card;
        }

      } catch (err) {
        console.error(err);
        forecastDiv.innerHTML = "❌ Failed to fetch weather data.";
      }
    }
  </script>

</body>
