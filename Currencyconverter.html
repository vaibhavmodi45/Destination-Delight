<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 110px auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-weight: 700;
      text-align: center;
      color: #5d3fd3;
      margin-bottom: 20px;
    }
    label {
      font-weight: 500;
      margin-top: 15px;
    }
    .btn-primary {
      background-color: #5d3fd3;
      border: none;
    }
    .btn-primary:hover {
      background-color: #4a2db3;
    }
    #result {
      margin-top: 30px;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      font-size: 1.2em;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .loader {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid #5d3fd3;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

    <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg fixed-top bg-light" style="box-shadow: 0px 2px 2px rgba(50, 50, 50, 0.1);">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="./assets/Destination Delight (1).png" alt="Logo" width="50" height="45" class="d-inline-block align-text-top" style="border-radius: 13px" />
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse mx-auto p-2" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="PopularDestination.html">Popular Destinations</a></li>
          <li class="nav-item"><a class="nav-link" href="Blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="travelHelpers.html">Travel Tools</a></li>
        </ul>
      </div>
      <form class="d-flex">
        <a href="Contact.html" class="btn btn-outline-primary">Contact Us</a>
      </form>
    </div>
  </nav>

  <div class="container">
    <h1>💱 Currency Converter</h1>
    <p class="text-center text-muted">Convert currencies instantly with real-time exchange rates.</p>

    <form id="currencyForm">
      <div class="mb-3">
        <label for="amount" class="form-label">Amount:</label>
        <input type="number" id="amount" class="form-control" placeholder="e.g., 100" required />
      </div>

      <div class="mb-3">
        <label for="from" class="form-label">From Currency:</label>
        <select id="from" class="form-select" required>
          <option value="INR">INR</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="JPY">JPY</option>
          <option value="AUD">AUD</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="to" class="form-label">To Currency:</label>
        <select id="to" class="form-select" required>
          <option value="USD">USD</option>
          <option value="INR">INR</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="JPY">JPY</option>
          <option value="AUD">AUD</option>
        </select>
      </div>

      <button type="button" class="btn btn-primary w-100" onclick="convertCurrency()">Convert</button>
    </form>

    <div id="result" class="mt-4"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    async function convertCurrency() {
      const amount = document.getElementById("amount").value.trim();
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;

      if (!amount || isNaN(amount) || amount <= 0) {
        alert("Please enter a valid amount.");
        return;
      }

      document.getElementById("result").innerHTML = `
        <div class="text-center">
          <div class="loader"></div>
          <p>⏳ Converting...</p>
        </div>
      `;

      try {
        const response = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
        if (!response.ok) {
          throw new Error("Failed to fetch exchange rates.");
        }

        const data = await response.json();
        const rate = data.rates[to];
        if (!rate) {
          throw new Error("Invalid currency conversion.");
        }

        const converted = (amount * rate).toFixed(2);
        document.getElementById("result").innerHTML = `
          <p>${amount} ${from} = <strong>${converted} ${to}</strong></p>
        `;
      } catch (error) {
        console.error(error);
        document.getElementById("result").innerHTML = `
          <div class="text-danger">
            ❌ Conversion failed. Please try again later.
          </div>
        `;
      }
    }
  </script>

</body>
</html>
