<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Translator Tool</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
      color: #333;
      margin: 80px;
    }
    .translator-container {
      max-width: 700px;
      margin: 10px auto;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-weight: 700;
      text-align: center;
      color: #5d3fd3;
      margin: 150px 0 20px;
    }
    textarea {
      resize: none;
    }
    .btn-primary {
      background-color: #5d3fd3;
      border: none;
    }
    .btn-primary:hover {
      background-color: #4a2db3;
    }
    #output {
      margin-top: 20px;
      background: #e9f2ff;
      border-left: 4px solid #5d3fd3;
      padding: 15px;
      border-radius: 6px;
      min-height: 60px;
      font-size: 1.05em;
    }
    .loader {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid #5d3fd3;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg fixed-top bg-light" style="box-shadow: 0px 2px 2px rgba(50, 50, 50, 0.1);">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img loading="lazy" src="./assets/Destination Delight (1).png" alt="Logo" width="50" height="45" class="d-inline-block align-text-top" style="border-radius: 13px" />
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse mx-auto p-2" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="PopularDestination.html">Popular Destinations</a></li>
          <li class="nav-item"><a class="nav-link" href="Blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="travelHelpers.html">Travel Tools</a></li>
        </ul>
      </div>
      <form class="d-flex">
        <a href="Contact.html" class="btn btn-outline-primary">Contact Us</a>
      </form>
    </div>
  </nav>



  <h1 class="mt-5">🌐 Language Translator</h1>

  <div class="translator-container d-flex flex-column mt-5">
    <label for="input-text" class="form-label">Enter text to translate:</label>
    <textarea id="input-text" class="form-control" rows="5" placeholder="Type something here..."></textarea>

    <div class="row mt-3">
      <div class="col-md-6">
        <label for="from-lang" class="form-label">From Language:</label>
        <select id="from-lang" class="form-select">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="ru">Russian</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="to-lang" class="form-label">To Language:</label>
        <select id="to-lang" class="form-select">
          <option value="hi">Hindi</option>
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="ru">Russian</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary w-100 mt-4" onclick="translateText()">Translate</button>

    <div id="output" class="mt-4"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    async function translateText() {
      const text = document.getElementById("input-text").value.trim();
      const from = document.getElementById("from-lang").value;
      const to = document.getElementById("to-lang").value;
      const output = document.getElementById("output");

      if (!text) {
        output.innerHTML = "⚠️ Please enter text to translate.";
        return;
      }

      output.innerHTML = `
        <div class="text-center">
          <div class="loader"></div>
          <p>⏳ Translating...</p>
        </div>
      `;

      try {
        const res = await fetch("https://libretranslate.de/translate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            q: text,
            source: from,
            target: to,
            format: "text"
          })
        });

        if (!res.ok) {
          throw new Error("Failed to fetch translation.");
        }

        const data = await res.json();
        output.innerHTML = data.translatedText || "⚠️ Translation failed.";
      } catch (err) {
        console.error(err);
        output.innerHTML = "❌ Error fetching translation.";
      }
    }
  </script>

</body>
</html>
