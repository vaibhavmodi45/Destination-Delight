<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trip Planner</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-weight: 700;
      text-align: center;
      color: #5d3fd3;
      margin-bottom: 20px;
    }
    label {
      font-weight: 500;
      margin-top: 15px;
    }
    .btn-primary {
      background-color: #5d3fd3;
      border: none;
    }
    .btn-primary:hover {
      background-color: #4a2db3;
    }
    #output {
      margin-top: 30px;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      white-space: pre-wrap;
      font-family: 'Roboto Mono', monospace;
    }
    .loader {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid #5d3fd3;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

    <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg fixed-top bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="./assets/DestinationDelightLogo.png" alt="Logo" width="50" height="45" class="d-inline-block align-text-top" style="border-radius: 13px" />
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse mx-auto p-2" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="PopularDestination.html">Popular Destinations</a></li>
          <li class="nav-item"><a class="nav-link" href="Blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="travelHelpers.html">Travel Tools</a></li>
        </ul>
      </div>
      <form class="d-flex">
        <a href="Contact.html" class="btn btn-outline-primary">Contact Us</a>
      </form>
    </div>
  </nav>

  <div class="container">
    <h1>🗺️ AI Trip Planner</h1>
    <p class="text-center text-muted">Plan your perfect trip in seconds with AI-powered recommendations!</p>

    <form id="tripForm">
      <div class="mb-3">
        <label for="city" class="form-label">Enter Destination City:</label>
        <input type="text" id="city" class="form-control" placeholder="e.g., Mumbai" required />
      </div>

      <div class="mb-3">
        <label for="days" class="form-label">Trip Duration (in days):</label>
        <input type="number" id="days" class="form-control" min="1" placeholder="e.g., 3" required />
      </div>

      <div class="mb-3">
        <label for="interests" class="form-label">Select Your Interests:</label>
        <select id="interests" class="form-select" multiple required>
          <option value="nature">Nature</option>
          <option value="food">Food</option>
          <option value="culture">Culture</option>
          <option value="adventure">Adventure</option>
          <option value="history">History</option>
          <option value="shopping">Shopping</option>
        </select>
        <small class="text-muted">Hold Ctrl (Windows) or Command (Mac) to select multiple options.</small>
      </div>

      <button type="button" class="btn btn-primary w-100" onclick="generatePlan()">Generate Trip Plan</button>
    </form>

    <div id="output" class="mt-4"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    async function generatePlan() {
      const city = document.getElementById('city').value.trim();
      const days = document.getElementById('days').value;
      const interestOptions = document.getElementById('interests').selectedOptions;
      const interests = Array.from(interestOptions).map(opt => opt.value).join(', ');

      if (!city || !days || interests.length === 0) {
        alert("Please fill in all fields.");
        return;
      }

      const prompt = `Create a detailed travel itinerary for a trip to ${city} for ${days} day(s) based on the following interests: ${interests}. Each day should include morning, afternoon, and evening activities.`;

      document.getElementById("output").innerHTML = `
        <div class="text-center">
          <div class="loader"></div>
          <p>⏳ Generating your personalized trip plan...</p>
        </div>
      `;

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer YOUR_OPENAI_API_KEY" // Replace with your OpenAI API key
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{ role: "user", content: prompt }],
            temperature: 0.7
          })
        });

        if (!response.ok) {
          throw new Error("Failed to fetch the trip plan. Please check your API key or try again later.");
        }

        const data = await response.json();
        const plan = data.choices[0].message.content;
        document.getElementById("output").innerText = plan;
      } catch (error) {
        console.error("Error:", error);
        document.getElementById("output").innerHTML = `
          <div class="text-danger">
            ❌ Something went wrong. Please try again later.
          </div>
        `;
      }
    }
  </script>
</body>
</html>
